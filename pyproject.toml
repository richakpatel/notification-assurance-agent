[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-assurance-agent"
version = "1.0.0"
description = "A hybrid reconciliation-and-diagnosis agent for entitlement operations (synthetic/anonymized capstone demo)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Richa Patel" }]
keywords = ["agent", "rag", "react", "reconciliation", "observability", "capstone"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# No third-party runtime dependencies — pure Python standard library by design.
dependencies = []

[project.urls]
Homepage = "https://github.com/richakpatel/notification-assurance-agent"
Repository = "https://github.com/richakpatel/notification-assurance-agent"

[project.scripts]
notification-agent-demo = "notification_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The knowledge base lives under data/ and is loaded by path, not packaged.
notification_agent = []
